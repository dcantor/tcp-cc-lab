<style>
@page { size: Letter; margin: 18mm 16mm 18mm 16mm; }
:root { --ink:#1f2937; --mute:#6b7280; --line:#e5e7eb; --accent:#1d4ed8; --code:#f3f4f6; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
* { box-sizing: border-box; }
body { font: 10.5pt/1.5 "Inter", "Segoe UI", system-ui, sans-serif; color: var(--ink); margin: 0; }
h1 { font-size: 22pt; margin: 0 0 6pt; color: #0f172a; }
h2 { font-size: 15pt; margin: 22pt 0 8pt; padding-bottom: 4pt; border-bottom: 2px solid var(--accent); color: #0f172a; page-break-after: avoid; }
h3 { font-size: 12pt; margin: 14pt 0 5pt; color: #0f172a; page-break-after: avoid; }
p { margin: 5pt 0; }
ul, ol { margin: 4pt 0 6pt; padding-left: 18pt; } li { margin: 2pt 0; }
code, pre, .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace; font-size: 8.6pt; }
code { background: var(--code); padding: 0 3px; border-radius: 3px; }
pre { background: var(--code); border: 1px solid var(--line); border-radius: 5px; padding: 7pt 9pt; white-space: pre-wrap; margin: 6pt 0; page-break-inside: avoid; }
table { border-collapse: collapse; width: 100%; margin: 6pt 0 8pt; font-size: 9.2pt; page-break-inside: avoid; }
th, td { text-align: left; padding: 3.5pt 6pt; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: #f8fafc; color: #334155; font-weight: 600; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.cover { height: 235mm; display: flex; flex-direction: column; justify-content: center; page-break-after: always; }
.cover .kicker { color: var(--accent); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 10pt; }
.cover .sub { font-size: 13pt; color: #334155; margin: 6pt 0 18pt; max-width: 150mm; }
.cover .meta { color: var(--mute); font-size: 9.5pt; line-height: 1.7; }
.box { border: 1px solid var(--line); border-left: 4px solid var(--accent); background: #f8fafc; padding: 7pt 10pt; border-radius: 4px; margin: 8pt 0; page-break-inside: avoid; }
.box.warn { border-left-color: var(--warn); } .box.ok { border-left-color: var(--ok); }
.box b:first-child { color: #0f172a; }
.toc { columns: 2; column-gap: 14mm; font-size: 10pt; } .toc div { margin: 2pt 0; break-inside: avoid; }
.page { page-break-before: always; }
.shot { display: block; max-height: 125mm; max-width: 100%; width: auto; height: auto; border: 1px solid var(--line); border-radius: 4px; margin: 6pt 0; }
.cap { color: var(--mute); font-size: 8.8pt; margin-top: -2pt; }
.step { display: grid; grid-template-columns: 22pt 1fr; gap: 6pt; margin: 6pt 0; page-break-inside: avoid; }
.step .n { width: 18pt; height: 18pt; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 9pt; display: flex; align-items: center; justify-content: center; margin-top: 1pt; }
.pill { display: inline-block; padding: 0 6pt; border-radius: 9pt; font-size: 8.5pt; border: 1px solid var(--line); color: #334155; }
svg text { font-family: "Inter", "Segoe UI", sans-serif; }
td.bad { color: var(--bad); font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10pt; }
.sw { display: inline-block; width: 9pt; height: 9pt; border-radius: 2px; margin-right: 5pt; vertical-align: -1pt; }
tr.tot td { font-weight: 600; border-top: 1.5px solid #cbd5e1; }
.small { font-size: 8.4pt; color: #334155; }
.fig { page-break-inside: avoid; margin: 6pt 0 8pt; }
.fig .t { font-weight: 600; font-size: 9.6pt; margin-bottom: 2pt; }
.shot { max-height: none; }
pre { page-break-inside: auto; }
.kv td:first-child { white-space: nowrap; color: #334155; }
</style>
